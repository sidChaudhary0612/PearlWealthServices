<div (click)="backBtn()" class="fs-3 position-absolute m-3 primaryColor cPr">
  <i class="bi bi-arrow-left-circle"></i>
</div>
<div class="d-flex gap-3 vh-100 align-items-center justify-content-center">
  <div
    class="h-75 d-flex flex-column align-items-center justify-content-start col-12"
  >
    <span class="text-center fs-4 fw-bold mb-4"
      >A Small Price for<br /><span class="italics fw-light">Priceless</span>
      Opportunities</span
    >
    <div class="d-flex flex-wrap col-12 justify-content-center">
      <div
        *ngFor="let plan of plans"
        class="primaryBorder text-center p-4 rounded col-11 col-md-5 col-lg-3 boxShadow m-3"
      >
        <div class="d-flex flex-row align-items-center justify-content-between">
          <span class="fs-6 fw-bold">{{ plan.name }}</span>
          <span
            class="secondaryBackground primaryColor fw-bold fs-9 px-1 text-center"
          >
            <i class="bi bi-star-fill primaryColor fs-9"></i> {{ plan.tag }}
          </span>
        </div>

        <span class="fs-9 text-secondary">{{ plan.description }}</span>
        <hr class="my-2" />

        <div class="d-flex flex-row align-items-center justify-content-between">
          <span class="fw-bold fs-5"
            >&#8377; {{ plan.price | number }} / {{ plan.duration }}</span
          >
          <span class="text-secondary fw-light fs-7">
            {{ plan.refundable ? "refundable" : "non-refundable" }}
          </span>
        </div>

        <ul class="list-unstyled text-start small my-4 text-secondary">
          <li class="mb-2 fs-8" *ngFor="let feature of plan.features">
            <i class="bi bi-check-circle me-2"></i>
            {{ feature }}
          </li>
        </ul>

        <button
          class="primaryBackground text-white border-0 fs-7 ls-1 w-100 fw-semibold py-2 rounded"
          (click)="goToPlan(plan)"
        >
          {{ plan.buttonText }}
        </button>
      </div>
    </div>
  </div>
</div>
